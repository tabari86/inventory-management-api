name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Verify Phase 1 release gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Report complete dependency audit
        run: npm audit --audit-level=critical

      - name: Verify repository security policy
        run: npm run verify:security

      - name: Verify JavaScript syntax
        run: npm run verify:syntax

      - name: Run tests
        run: npm test

      - name: Validate OpenAPI document
        run: npm run validate:openapi

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build Docker image
        run: docker build --tag inventory-management-api:ci .

      - name: Verify Docker runtime
        run: npm run verify:docker
