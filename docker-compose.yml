services:
  api:
    build: .
    container_name: inventory-management-api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/inventory_management
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-docker_local_access_token_secret}
      JWT_ACCESS_EXPIRES_IN: 15m
      ADMIN_NAME: ${ADMIN_NAME:-Local Admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change_this_local_admin_password}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:3000/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  seed-admin:
    build: .
    profiles: ["seed"]
    environment:
      MONGODB_URI: mongodb://mongo:27017/inventory_management
      ADMIN_NAME: ${ADMIN_NAME:-Local Admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change_this_local_admin_password}
    depends_on:
      mongo:
        condition: service_healthy
    command: npm run seed:admin
    restart: "no"

  mongo:
    image: mongo:8
    container_name: inventory-management-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo_data:
