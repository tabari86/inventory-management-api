services:
  api:
    build: .
    container_name: inventory-management-api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/inventory_management?replicaSet=rs0
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-docker_local_access_token_secret}
      JWT_ACCESS_EXPIRES_IN: 15m
      ADMIN_NAME: ${ADMIN_NAME:-Local Admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change_this_local_admin_password}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:3000/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  seed-admin:
    build: .
    profiles: ["seed"]
    environment:
      MONGODB_URI: mongodb://mongo:27017/inventory_management?replicaSet=rs0
      ADMIN_NAME: ${ADMIN_NAME:-Local Admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change_this_local_admin_password}
    depends_on:
      mongo:
        condition: service_healthy
    command: npm run seed:admin
    restart: "no"

  mongo:
    image: mongo:8
    container_name: inventory-management-mongo
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - |
          mongosh --quiet --eval "
            try {
              if (rs.status().myState === 1) {
                quit(0);
              }
            } catch (statusError) {
              try {
                rs.initiate({
                  _id: 'rs0',
                  members: [{ _id: 0, host: 'mongo:27017' }]
                });
              } catch (initError) {
                if (initError.codeName !== 'AlreadyInitialized') {
                  throw initError;
                }
              }
            }
            quit(1);
          "
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo_data:
